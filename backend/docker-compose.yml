version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: mechuri_postgres
    restart: always
    environment:
      POSTGRES_DB: mechuri_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mechuri_password
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
