version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mechuri_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: mechuri_password
      MYSQL_DATABASE: mechuri_db
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
