# Render Blueprint: 메추리 API 서버 + PostgreSQL
# 사용법은 docs/deploy.md. Render 대시보드 → New → Blueprint 에서 이 저장소를 고르면 아래 리소스가 만들어진다.
# sync: false 로 둔 값은 처음 만들 때 대시보드에서 직접 넣는다 (저장소에 비밀 값을 두지 않기 위해).
databases:
  - name: mechuri-db
    plan: free
    region: singapore
    databaseName: mechuri_db
    user: mechuri
    postgresMajorVersion: "15"

services:
  - type: web
    name: mechuri-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
      ignoredPaths:
        - backend/test/**
    envVars:
      - key: NODE_ENV
        value: production
      # Render 내부 주소라서 SSL 없이 접속한다
      - key: DATABASE_URL
        fromDatabase:
          name: mechuri-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: KAKAO_REST_API_KEY
        sync: false
      # 예: https://mechuri-api.onrender.com/api/auth/kakao/callback (카카오 개발자 콘솔에도 같은 값 등록)
      - key: KAKAO_REDIRECT_URI
        sync: false
